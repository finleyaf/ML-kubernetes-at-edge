apiVersion: v1
kind: Pod
metadata:
  name: mixed-lite-test
  labels:
    workload-type: mixed-lite
    experiment: scheduler-eval
spec:
  containers:
    - name: mixed-lite-stress
      image: polinux/stress
      command: ["stress"]
      args: ["--cpu", "1", "--vm", "1", "--vm-bytes", "64M", "--timeout", "45"]
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
  restartPolicy: Never